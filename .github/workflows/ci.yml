name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  GOPRIVATE: github.com/anthropics/anthropic-sdk-go,github.com/anthropics/anthropic-sdk-go-private

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: 'ubuntu-latest'
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-go
        with:
          stainless-api-key: ${{ secrets.STAINLESS_API_KEY }}

      - name: Link staging branch
        if: github.repository == 'anthropics/anthropic-sdk-cli-private'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          ./scripts/link "github.com/anthropics/anthropic-sdk-go-private@${REF_NAME}" || true

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run lints
        run: ./scripts/lint

  build:
    timeout-minutes: 10
    name: build
    permissions:
      contents: read
      id-token: write
    runs-on: 'ubuntu-latest'
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-go
        with:
          stainless-api-key: ${{ secrets.STAINLESS_API_KEY }}

      - name: Link staging branch
        if: github.repository == 'anthropics/anthropic-sdk-cli-private'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          ./scripts/link "github.com/anthropics/anthropic-sdk-go-private@${REF_NAME}" || true

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          version: "2.15.2"
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get GitHub OIDC Token
        if: |-
          github.repository == 'anthropics/anthropic-sdk-cli-private' &&
          !startsWith(github.ref, 'refs/heads/stl/')
        id: github-oidc
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: core.setOutput('github_token', await core.getIDToken());

      - name: Upload tarball
        if: |-
          github.repository == 'anthropics/anthropic-sdk-cli-private' &&
          !startsWith(github.ref, 'refs/heads/stl/')
        env:
          URL: https://pkg.stainless.com/s
          AUTH: ${{ steps.github-oidc.outputs.github_token }}
          SHA: ${{ github.sha }}
        run: ./scripts/utils/upload-artifact.sh

      - name: Upload ant-darwin-arm64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ant-darwin-arm64
          path: dist/macos_darwin_arm64*/ant
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload ant-darwin-amd64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ant-darwin-amd64
          path: dist/macos_darwin_amd64*/ant
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload ant-linux-amd64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ant-linux-amd64
          path: dist/linux_linux_amd64*/ant
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload ant-linux-arm64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ant-linux-arm64
          path: dist/linux_linux_arm64*/ant
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload ant-windows-amd64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ant-windows-amd64
          path: dist/windows_windows_amd64*/ant.exe
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload ant-windows-arm64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ant-windows-arm64
          path: dist/windows_windows_arm64*/ant.exe
          retention-days: 90
          if-no-files-found: ignore

  test:
    timeout-minutes: 20
    name: test
    runs-on: 'ubuntu-latest'
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-go
        with:
          stainless-api-key: ${{ secrets.STAINLESS_API_KEY }}

      - name: Link staging branch
        if: github.repository == 'anthropics/anthropic-sdk-cli-private'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          ./scripts/link "github.com/anthropics/anthropic-sdk-go-private@${REF_NAME}" || true

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run tests
        run: ./scripts/test
