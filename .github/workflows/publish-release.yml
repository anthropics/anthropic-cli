---
name: Publish Release

concurrency:
  group: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Verify release commit is on main's first-parent history
      # The environment's branch policy matches ref names, not commit
      # ancestry, so a v* tag on a non-main commit would otherwise pass.
      # Runs in a separate job before the environment-gated goreleaser
      # job so a bad tag never triggers a deployment-approval prompt or
      # mints app tokens. --first-parent ensures only mainline commits
      # qualify (a commit inside a merged side branch would pass a plain
      # ancestor check despite never being reviewed in isolation).
      run: |
        git fetch origin main
        if ! git rev-list --first-parent origin/main | grep -qxF "$GITHUB_SHA"; then
          echo "::error::Ref $GITHUB_REF points at $GITHUB_SHA, which is not on the first-parent history of origin/main. Refusing to release."
          exit 1
        fi

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    # Scopes RELEASE_APP_* and MACOS_* to this environment. Tag creation
    # is restricted to the Stainless App via a repository tag ruleset.
    environment: production-release
    env:
      NODE_OPTIONS: --use-openssl-ca
    steps:
    - name: Set up CA certificates
      shell: sudo /usr/bin/python3 -I {0}
      run: |
        import base64, hashlib, pathlib, re, subprocess, sys

        EXCLUDED = set("""
        86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b
        bc4d809b15189d78db3e1d8cf4f9726a795da1643ca5f1358e1ddb0edc0d7eb3
        40f6af0346a99aa1cd1d555a4e9cce62c7f9634603ee406615833dc8c8d00367
        125609aa301da0a249b97a8239cb6a34216f44dcac9f3954b14292f2e8c8608f
        """.split())
        PEM = re.compile(b"-----BEGIN [A-Z0-9 ]*CERTIFICATE-----(.+?)-----END", re.S)
        SEQUENCE = bytes.fromhex("3082")

        def stop(what):
            sys.exit(
                what + " The job stops here, before it fetches or publishes anything."
                " If a re-run fails too, the runner image has changed and this step has to follow it."
            )

        def excluded(path):
            data = path.read_bytes()
            for blob in [data] + [base64.b64decode(body) for body in PEM.findall(data)]:
                for match in re.finditer(SEQUENCE, blob):
                    end = match.start() + 4 + int.from_bytes(blob[match.start() + 2 : match.start() + 4], "big")
                    if hashlib.sha256(blob[match.start() : end]).hexdigest() in EXCLUDED:
                        return True
            return False

        conf = pathlib.Path("/etc/ca-certificates.conf")
        source = pathlib.Path("/usr/share/ca-certificates")
        store = pathlib.Path("/etc/ssl/certs")

        lines = conf.read_text().splitlines(keepends=True)
        for i, line in enumerate(lines):
            file = source / line.strip()
            if line.strip() and line[0] not in "#!" and file.is_file() and excluded(file):
                lines[i] = "!" + line
        conf.write_text("".join(lines))
        for arguments in ([], ["--fresh"]):
            run = subprocess.run(["update-ca-certificates", *arguments], capture_output=True)
            if run.returncode or b"exited with code" in run.stdout + run.stderr:
                stop("update-ca-certificates failed.")

        for file in [*store.rglob("*"), pathlib.Path("/etc/ssl/cert.pem")]:
            if file.is_file() and excluded(file):
                stop("A file under /etc/ssl still holds an excluded CA certificate.")
        print(len(PEM.findall((store / "ca-certificates.crt").read_bytes())), "CA certificates")

    - name: Generate release app token (this repo)
      id: app-token
      uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
      with:
        app-id: ${{ secrets.RELEASE_APP_ID }}
        private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

    - name: Generate release app token (homebrew-tap)
      id: tap-token
      uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
      with:
        app-id: ${{ secrets.RELEASE_APP_ID }}
        private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        owner: anthropics
        repositories: homebrew-tap

    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: "go.mod"

    - name: Encode notary key
      # The MACOS_NOTARY_KEY env secret holds the raw .p8 contents, but
      # goreleaser's notarize step expects the key base64-encoded.
      shell: bash
      run: |
        encoded=$(printf '%s' "$RAW_KEY" | base64 -w0)
        echo "::add-mask::$encoded"
        echo "MACOS_NOTARY_KEY=$encoded" >> "$GITHUB_ENV"
      env:
        RAW_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
      with:
        version: "2.17.0"
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}
        MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
        MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
        MACOS_NOTARY_KEY: ${{ env.MACOS_NOTARY_KEY }}
