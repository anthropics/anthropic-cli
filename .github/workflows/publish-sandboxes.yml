---
name: Publish Sandboxes

concurrency:
  group: publish-sandboxes

on:
  push:
    tags:
      - "sandboxes-v*"

permissions:
  contents: read

env:
  REGISTRY: us-docker.pkg.dev/anthropic-public-registry/sandboxes

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      ant: ${{ steps.version.outputs.ant }}
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Verify release commit is on main's first-parent history
      run: |
        git fetch origin main
        commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
        if ! git rev-list --first-parent origin/main | grep -qxF "$commit"; then
          echo "::error::Ref $GITHUB_REF points at $commit, which is not on the first-parent history of origin/main. Refusing to release."
          exit 1
        fi

    - name: Verify the tag names the version this commit declares
      id: version
      run: |
        declared="$(jq -r .sandboxes .version-manifest.json)"
        if [ "${GITHUB_REF_NAME#sandboxes-v}" != "$declared" ]; then
          echo "::error::Tag $GITHUB_REF_NAME doesn't match version $declared, which .version-manifest.json gives for sandboxes at $GITHUB_SHA. Refusing to release. To publish, release a new version under a new tag."
          exit 1
        fi
        echo "version=$declared" >> "$GITHUB_OUTPUT"
        ant="$(sed -n 's/^ARG ANT_VERSION=//p' sandboxes/image/Dockerfile)"
        [[ $ant =~ ^[0-9.]+$ ]]
        echo "ant=$ant" >> "$GITHUB_OUTPUT"

  # Building runs third-party code, so it runs in a job that can't publish.
  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --use-openssl-ca
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
    - &ca-certificates
      name: Set up CA certificates
      shell: sudo /usr/bin/python3 -I {0}
      run: |
        import base64, hashlib, pathlib, re, subprocess, sys

        EXCLUDED = set("""
        86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b
        bc4d809b15189d78db3e1d8cf4f9726a795da1643ca5f1358e1ddb0edc0d7eb3
        40f6af0346a99aa1cd1d555a4e9cce62c7f9634603ee406615833dc8c8d00367
        125609aa301da0a249b97a8239cb6a34216f44dcac9f3954b14292f2e8c8608f
        d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4
        """.split())
        PEM = re.compile(b"-----BEGIN [A-Z0-9 ]*CERTIFICATE-----(.+?)-----END", re.S)
        SEQUENCE = bytes.fromhex("3082")

        def stop(what):
            sys.exit(
                what + " The job stops here, before it fetches or publishes anything."
                " If a re-run fails too, the runner image has changed and this step has to follow it."
            )

        def excluded(path):
            data = path.read_bytes()
            for blob in [data] + [base64.b64decode(body) for body in PEM.findall(data)]:
                for match in re.finditer(SEQUENCE, blob):
                    end = match.start() + 4 + int.from_bytes(blob[match.start() + 2 : match.start() + 4], "big")
                    if hashlib.sha256(blob[match.start() : end]).hexdigest() in EXCLUDED:
                        return True
            return False

        conf = pathlib.Path("/etc/ca-certificates.conf")
        source = pathlib.Path("/usr/share/ca-certificates")
        store = pathlib.Path("/etc/ssl/certs")

        lines = conf.read_text().splitlines(keepends=True)
        for i, line in enumerate(lines):
            file = source / line.strip()
            if line.strip() and line[0] not in "#!" and file.is_file() and excluded(file):
                lines[i] = "!" + line
        conf.write_text("".join(lines))
        for arguments in ([], ["--fresh"]):
            run = subprocess.run(["update-ca-certificates", *arguments], capture_output=True)
            if run.returncode or b"exited with code" in run.stdout + run.stderr:
                stop("update-ca-certificates failed.")

        for file in [*store.rglob("*"), pathlib.Path("/etc/ssl/cert.pem")]:
            if file.is_file() and excluded(file):
                stop("A file under /etc/ssl still holds an excluded CA certificate.")
        print(len(PEM.findall((store / "ca-certificates.crt").read_bytes())), "CA certificates")

    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        image: docker.io/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        cache-image: false

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

    - name: Build the images and package the chart
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/out/images"
        build() {
          local name=$1
          shift
          docker buildx build --platform linux/amd64,linux/arm64 \
            --output "type=oci,dest=$RUNNER_TEMP/out/images/$name,tar=false" "$@"
        }
        build cma-dispatcher --file sandboxes/dispatcher/Dockerfile --build-arg "VERSION=$VERSION" sandboxes
        build cma-sandbox sandboxes/image
        sandbox="$(jq -r '.manifests[0].digest' "$RUNNER_TEMP/out/images/cma-sandbox/index.json")"
        build cma-sandbox-source --target source \
          --build-context "packages=oci-layout://$RUNNER_TEMP/out/images/cma-sandbox@$sandbox" sandboxes/image
        helm package sandboxes/kubernetes/chart --version "$VERSION" --app-version "$VERSION" --destination "$RUNNER_TEMP/out"

    - name: Save what was built for the publish job
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sandboxes
        path: ${{ runner.temp }}/out
        if-no-files-found: error

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      sums: ${{ steps.push.outputs.sums }}
    env:
      NODE_OPTIONS: --use-openssl-ca
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
    - *ca-certificates

    - name: Get what the build job saved
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: sandboxes
        path: ${{ runner.temp }}/out

    - name: List the images' digests
      shell: bash
      run: |
        for name in cma-dispatcher cma-sandbox cma-sandbox-source; do
          # skopeo reads the manifest here as it does when it pushes it.
          digest="$(skopeo inspect --raw "oci:$RUNNER_TEMP/out/images/$name" | sha256sum | cut -d' ' -f1)"
          echo "$digest  $REGISTRY/$name"
        done > "$RUNNER_TEMP/subjects"

    # Before the push, so that no image's tag is ever without its attestation.
    - name: Attest the images
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-checksums: ${{ runner.temp }}/subjects

    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      id: auth
      with:
        workload_identity_provider: projects/716876029138/locations/global/workloadIdentityPools/github-sandboxes-release/providers/github-actions
        service_account: sandboxes-publisher@anthropic-public-registry.iam.gserviceaccount.com
        token_format: access_token
        create_credentials_file: false

    # The registry's tags are immutable, so a push can't replace a version.
    - name: Push the images and the chart
      id: push
      shell: bash
      env:
        ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
      run: |
        # helm push takes the chart's name and tag from the package itself.
        test "$(helm show chart "$RUNNER_TEMP/out/cma-sandboxes-$VERSION.tgz" | grep -cxF -e "name: cma-sandboxes" -e "version: $VERSION")" = 2
        docker login us-docker.pkg.dev --username oauth2accesstoken --password-stdin <<< "$ACCESS_TOKEN"
        helm registry login us-docker.pkg.dev --username oauth2accesstoken --password-stdin <<< "$ACCESS_TOKEN"
        while read -r digest subject; do
          skopeo copy --all --preserve-digests "oci:$RUNNER_TEMP/out/images/${subject##*/}" "docker://$subject:$VERSION"
          echo "sha256:$digest  $subject:$VERSION" >> "$RUNNER_TEMP/sums"
        done < "$RUNNER_TEMP/subjects"
        touch -d @0 "$RUNNER_TEMP/out/cma-sandboxes-$VERSION.tgz" # so that a re-run pushes the same digest
        helm push "$RUNNER_TEMP/out/cma-sandboxes-$VERSION.tgz" "oci://$REGISTRY/charts" 2>&1 | tee "$RUNNER_TEMP/helm.log"
        chart="$(sed -n 's/^Digest: //p' "$RUNNER_TEMP/helm.log")"
        [[ $chart =~ ^sha256:[0-9a-f]{64}$ ]]
        echo "chart=$chart" >> "$GITHUB_OUTPUT"
        echo "$chart  $REGISTRY/charts/cma-sandboxes:$VERSION" >> "$RUNNER_TEMP/sums"
        { echo "sums<<SUMS"; cat "$RUNNER_TEMP/sums"; echo SUMS; } >> "$GITHUB_OUTPUT"

    - name: Attest the Helm chart
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ env.REGISTRY }}/charts/cma-sandboxes
        subject-digest: ${{ steps.push.outputs.chart }}

  # Writing the release needs no registry, so it runs in a job that can't sign in.
  notes:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - *ca-certificates

    - name: Add the digests to the release notes, and upload the checksums file last
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        SUMS: ${{ needs.publish.outputs.sums }}
        VERSION: ${{ needs.verify.outputs.version }}
        ANT_VERSION: ${{ needs.verify.outputs.ant }}
      run: |
        cd "$RUNNER_TEMP"
        echo "$SUMS" > "sandboxes_${VERSION}_checksums.txt"
        {
          gh release view "$GITHUB_REF_NAME" --json body --jq .body | sed '/^## Self-hosted sandbox images$/,$d'
          printf '%s\n' "" "## Self-hosted sandbox images" "" "\`\`\`" "$SUMS" "\`\`\`" ""
          echo "\`cma-sandbox\` carries \`ant\` $ANT_VERSION. Verify an image or the chart with \`gh attestation verify oci://IMAGE@DIGEST --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/publish-sandboxes.yml --source-ref $GITHUB_REF\`, where IMAGE is its name without the tag."
        } > notes.md
        gh release edit "$GITHUB_REF_NAME" --latest=false --notes-file notes.md
        gh release upload --clobber "$GITHUB_REF_NAME" "sandboxes_${VERSION}_checksums.txt"
