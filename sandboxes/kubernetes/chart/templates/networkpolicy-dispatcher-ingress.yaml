# The dispatcher answers only sandbox pods. Its egress is left open: it dials
# the CMA server and the Kubernetes API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cma-dispatcher-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      anthropic.com/role: dispatcher
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              anthropic.com/role: sandbox
      ports:
        - protocol: TCP
          port: 8443
