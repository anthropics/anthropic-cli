{{- $platform := include "cma-sandboxes.platformPreset" . | fromYaml -}}
{{- if eq $platform.dnsPolicies "gke" }}
# Under gVisor on GKE, DNS queries leave the pod for NodeLocal DNSCache at
# 169.254.20.10 instead of being redirected on the node, so that one link-local
# address is opened on port 53. The rest of 169.254.0.0/16 stays closed by the
# internet policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cma-sandbox-dns-nodelocal
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      anthropic.com/role: sandbox
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.20.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
