# Sandbox pods reach cluster DNS, and nothing reaches them except the
# dispatcher.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cma-sandbox-baseline
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      anthropic.com/role: sandbox
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              anthropic.com/role: dispatcher
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
