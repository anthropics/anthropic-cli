apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cma-sandbox-to-dispatcher
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      anthropic.com/role: sandbox
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              anthropic.com/role: dispatcher
      ports:
        - protocol: TCP
          port: 8443
